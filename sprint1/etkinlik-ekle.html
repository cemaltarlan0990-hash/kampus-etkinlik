<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
</head>
<body>
    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-detay.html">Detay</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <p>Seminer veya atölye eklemek için formu doldurun. Tüm alanlar zorunludur.</p>
        <!-- for ve id aynı olunca etiket ile form alanı birbirine bağlanır. -->
        <form action="etkinlik-ekle.html#form-notu" method="get">
            <p>
                <label for="etkinlik-adi">Etkinlik Adı</label><br>
                <input type="text" id="etkinlik-adi" name="etkinlik-adi" required>
            </p>

            <p>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                </select>
            </p>

            <p>
                <label for="tarih-saat">Tarih / Saat</label><br>
                <input type="datetime-local" id="tarih-saat" name="tarih-saat" required>
            </p>

            <p>
                <label for="yer">Yer</label><br>
                <input type="text" id="yer" name="yer" required>
            </p>

            <p>
                <label for="kontenjan">Kontenjan</label><br>
                <input type="number" id="kontenjan" name="kontenjan" min="1" required>
            </p>

            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="4" cols="30" required></textarea>
            </p>

            <button type="submit">Kaydet</button>
        </form>
        <p id="form-notu"><small>Bu örnek form bilgileri kaydetmez.</small></p>
    </main>
    <footer>
        <!-- Buraya kendi adınızı ve öğrenci numaranızı yazın. -->
        <p>Ad Soyad · 20xxxxxxx · 2026</p>
    </footer>
</body>
</html>
