<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2211012055.css">
    <script src="js/data.js" defer></script>
    <script src="js/event-form.js" defer></script>
</head>
<body>
    <header>
        <div class="kabuk">
            <h1>Etkinlik Ekle</h1>
            <nav>
                <a href="index.html">Ana Sayfa</a>
                <a href="etkinlikler.html">Etkinlikler</a>
                <a href="etkinlik-ekle.html" aria-current="page">Ekle</a>
            </nav>
        </div>
    </header>

    <main class="kabuk">
        <p id="form-aciklama">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

        <section class="form-kutusu">
            <!-- novalidate: tarayıcının kendi uyarı balonları kapalı, kontrolü event-form.js yapar. -->
            <form id="etkinlik-formu" novalidate>
                <div class="alanlar">
                    <p class="alan genis">
                        <label for="ad">Etkinlik Adı *</label>
                        <input type="text" id="ad" name="ad" required aria-describedby="ad-hata">
                        <span class="hata-metni" id="ad-hata"></span>
                    </p>

                    <p class="alan">
                        <label for="kategori">Kategori *</label>
                        <select id="kategori" name="kategori" required aria-describedby="kategori-hata">
                            <option value="">Seçiniz</option>
                        </select>
                        <span class="hata-metni" id="kategori-hata"></span>
                    </p>

                    <p class="alan">
                        <label for="yer">Yer *</label>
                        <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu" required aria-describedby="yer-hata">
                        <span class="hata-metni" id="yer-hata"></span>
                    </p>

                    <p class="alan">
                        <label for="tarih">Tarih *</label>
                        <input type="date" id="tarih" name="tarih" required aria-describedby="tarih-hata">
                        <span class="hata-metni" id="tarih-hata"></span>
                    </p>

                    <p class="alan">
                        <label for="saat">Saat *</label>
                        <input type="time" id="saat" name="saat" required aria-describedby="saat-hata">
                        <span class="hata-metni" id="saat-hata"></span>
                    </p>

                    <p class="alan">
                        <label for="kontenjan">Kontenjan</label>
                        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" aria-describedby="kontenjan-hata">
                        <span class="hata-metni" id="kontenjan-hata"></span>
                    </p>

                    <p class="alan genis">
                        <label for="aciklama">Açıklama</label>
                        <textarea id="aciklama" name="aciklama" rows="4"></textarea>
                    </p>
                </div>

                <div class="dugmeler">
                    <button type="submit">Kaydet</button>
                </div>
            </form>

            <div id="form-mesaj" class="form-mesaj" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <div class="kabuk">
            <p>Cemal Tarlan · 2211012055 · 2026</p>
        </div>
    </footer>
</body>
</html>
